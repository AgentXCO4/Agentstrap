name: CI (Debug)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          6.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore .\Agentstrap.sln

    - name: Build
      run: dotnet build .\Agentstrap.sln -c Debug --no-restore

    - name: Publish
      run: dotnet publish .\Agentstrap\Agentstrap.csproj -r win-x64 -c Debug --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -o .\artifacts\debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Agentstrap-Debug-win-x64
        path: .\artifacts\debug\Agentstrap.exe
        if-no-files-found: error
