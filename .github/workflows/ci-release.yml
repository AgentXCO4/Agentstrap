name: CI (Release)
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          6.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore .\Agentstrap.sln

    - name: Build
      run: dotnet build .\Agentstrap.sln -c Release --no-restore

    - name: Publish
      run: dotnet publish .\Agentstrap\Agentstrap.csproj -r win-x64 -c Release --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -o .\artifacts\publish

    - name: Upload Artifact
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: Agentstrap-win-x64
        path: .\artifacts\publish\Agentstrap.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      actions: read

    steps:
      - name: Validate signing configuration
        shell: bash
        run: |
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY SIGNPATH_ARTIFACT_CONFIGURATION; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub secret or variable: ${name}"
              exit 1
            fi
          done
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          SIGNPATH_ARTIFACT_CONFIGURATION: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION }}

      - name: Sign and download artifact
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION }}
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'release'

      - name: Rename binaries
        run: mv release/Agentstrap.exe Agentstrap-${{ github.ref_name }}-win-x64.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/Agentstrap-${{ github.ref_name }}-win-x64.exe
          name: Agentstrap ${{ github.ref_name }}

  release-test:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-test')

    permissions:
      contents: write
      actions: read

    steps:
      - name: Validate signing configuration
        shell: bash
        run: |
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY SIGNPATH_ARTIFACT_CONFIGURATION; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub secret or variable: ${name}"
              exit 1
            fi
          done
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          SIGNPATH_ARTIFACT_CONFIGURATION: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION }}

      - name: Sign and download artifact
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION }}
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'release'

      - name: Rename binaries
        run: mv release/Agentstrap.exe Agentstrap-${{ github.ref_name }}-win-x64.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/Agentstrap-${{ github.ref_name }}-win-x64.exe
          name: Agentstrap ${{ github.ref_name }}

