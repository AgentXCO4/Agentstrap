name: Bug Report
description: Report a problem you're having
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        Please use this form for reproducible Agentstrap bugs. Do not include passwords, Roblox cookies, authentication tokens, or other private account data.
        ### **Instructions**
        - Check the [Agentstrap releases](https://github.com/AgentXCO4/Agentstrap/releases) for the version you are using.
        - Search existing Agentstrap issues for the same problem.
        - Include exact steps, what you expected, and what happened.
        - Review logs and screenshots and remove private information before attaching them.
  - type: checkboxes
    id: terms
    attributes:
      label: I have...
      options:
        - label: I have read the instructions, and I didn't find a solution in any of the links above.
          required: true
        - label: I am using the latest version of Agentstrap.
          required: true
  - type: input
    id: version
    attributes:
      label: Agentstrap Version
      description: "What version of Agentstrap are you using? Find it in the 'About' section of the Settings"
      placeholder: "2.11.4 (for example)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What problem did you encounter?
      description: Describe what you expected and what happened instead. Attach a screenshot if it helps explain the issue.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: How do you reproduce the problem?
      description: List the steps to reproduce the problem from start to finish.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
  - type: textarea
    id: log
    attributes:
      label: Agentstrap Log
      description: Paste the relevant Agentstrap log. Remove cookies, tokens, account details, and private file paths first. If there is no relevant log, leave this empty.
      value: "N/A"
      render: text
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Include the Windows edition and OS build if known.
      placeholder: "Windows 11, version 24H2, build ..."
    validations:
      required: true

